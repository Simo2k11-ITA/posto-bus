<title>Posto Bus</title>
<style>
:root{
  --bg:#0A0D14; --panel:#121722; --panel2:#181E2B; --line:#232A3A; --seat:#1E2534; --seat-hi:#273044;
  --ink:#F3F5FA; --muted:#7D879C; --dim:#4A5468; --yel:#FFAD00; --navy:#05164D;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{background:var(--bg);touch-action:pan-y;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,sans-serif;
  padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 120px)}
button{font-family:inherit}
/* header */
.top{max-width:460px;margin:0 auto 16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--muted)}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--yel);display:flex;align-items:center;justify-content:center}
.brand i svg{width:15px;height:15px}
h1{margin:0 0 14px;font-size:32px;line-height:1.02;font-weight:760;letter-spacing:-.035em}
h1 span{color:var(--muted)}
.route{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.route .code{font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1}
.route .city{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.route .r{text-align:right}
.route .mid{position:relative;height:22px;display:flex;align-items:center;justify-content:center}
.route .mid::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--dim)}
.route .mid span{position:relative;background:var(--panel);padding:0 8px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--yel)}
.route .meta{grid-column:1/4;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;
  font-size:11px;color:var(--muted);font-weight:600}
.route .meta b{color:var(--ink);font-weight:700}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex:none}
.gear svg{width:19px;height:19px}
/* bus */
.bus{max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:44px 44px 30px 30px;padding:14px 20px 22px;position:relative}
/* specchietti */

<script>
// ================= BIGLIETTO D'IMBARCO (canvas) =================
const NAVY = "#05164D", NAVY2 = "#0A2472", YEL = "#FFAD00", INK = "#05164D",
      GREY = "#7B8499", LINE = "#D9DEE8", SEATC = "#E4E8F0";
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Roboto,sans-serif';

function rrect(c, x, y, w, h, r) {
  const R = typeof r === "number" ? [r, r, r, r] : r; // tl tr br bl
  c.beginPath();
  c.moveTo(x + R[0], y);
  c.lineTo(x + w - R[1], y); c.arcTo(x + w, y, x + w, y + R[1], R[1]);
  c.lineTo(x + w, y + h - R[2]); c.arcTo(x + w, y + h, x + w - R[2], y + h, R[2]);
  c.lineTo(x + R[3], y + h); c.arcTo(x, y + h, x, y + h - R[3], R[3]);
  c.lineTo(x, y + R[0]); c.arcTo(x, y, x + R[0], y, R[0]);
  c.closePath();
}
function txt(c, s, x, y, size, weight, color, align = "left", spacing = 0) {
  c.font = `${weight} ${size}px ${FONT}`; c.fillStyle = color; c.textBaseline = "alphabetic";
  if (!spacing) { c.textAlign = align; c.fillText(s, x, y); return; }
  c.textAlign = "left";
  const chars = [...s], w = chars.reduce((a, ch) => a + c.measureText(ch).width + spacing, -spacing);
  let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  for (const ch of chars) { c.fillText(ch, cx, y); cx += c.measureText(ch).width + spacing; }
}
const label = (c, s, x, y, align) => txt(c, s.toUpperCase(), x, y, 8, 700, GREY, align, 1.4);

function busGlyph(c, cx, cy, s, color) { // piccolo pullman visto di fronte
  c.save(); c.translate(cx, cy); c.scale(s, s); c.fillStyle = color;
  rrect(c, -7, -8, 14, 14, 3); c.fill();
  c.fillStyle = YEL === color ? NAVY : "#fff";
  rrect(c, -5, -6, 10, 5, 1.2); c.fill();
  c.beginPath(); c.arc(-3.5, 3, 1.2, 0, 7); c.arc(3.5, 3, 1.2, 0, 7); c.fill();
  c.fillStyle = color; c.fillRect(-6, 6, 3, 2.5); c.fillRect(3, 6, 3, 2.5);
  c.restore();
}

// codice 2D finto (stile Aztec)
function fakeCode(c, x, y, size, seed) {
  const n = 23, m = size / n;
  let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  c.fillStyle = NAVY;
  const mid = 11;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const d = Math.max(Math.abs(i - mid), Math.abs(j - mid));
    let on;
    if (d <= 5) on = d % 2 === 1 || d === 0; // occhio centrale
    else if (d === 6) on = false;
    else on = rnd() > 0.5;
    if (on) c.fillRect(x + j * m, y + i * m, m + 0.3, m + 0.3);
  }
}

// ---------- mezza cabina disegnata apposta ----------
// geometria comune
const CAB = { sw: 30, sh: 28, g: 6, aisle: 24, pad: 14 };
CAB.colX = [0, CAB.sw + CAB.g, 2 * CAB.sw + CAB.g + CAB.aisle, 3 * CAB.sw + 2 * CAB.g + CAB.aisle];
CAB.inner = 4 * CAB.sw + 2 * CAB.g + CAB.aisle;          // 156
CAB.w = CAB.inner + 2 * CAB.pad;                           // 184

function cabinHeight(half) {
  const { sh, g } = CAB;
  return half === "front" ? 30 + 26 + 10 + 6 * (sh + g) - g + 16 : 16 + 7 * (sh + g) - g + 26;
}

function drawCabin(c, x, y, half, her, me, meInitial) {
  const { sw, sh, g, pad, colX, inner, w } = CAB;
  const h = cabinHeight(half);
  // carrozzeria
  c.save();
  c.shadowColor = "rgba(5,22,77,.10)"; c.shadowBlur = 10; c.shadowOffsetY = 3;
  rrect(c, x, y, w, h, half === "front" ? [26, 26, 14, 14] : [14, 14, 26, 26]);
  c.fillStyle = "#fff"; c.fill(); c.restore();
  rrect(c, x, y, w, h, half === "front" ? [26, 26, 14, 14] : [14, 14, 26, 26]);
  c.lineWidth = 1.5; c.strokeStyle = LINE; c.stroke();

  const ix = x + pad;
  const seat = (id, sx, sy, sWidth) => {
    const isHer = id === her, isMe = id === me;
    rrect(c, sx, sy, sWidth, sh, [8, 8, 5, 5]);
    c.fillStyle = isHer ? YEL : isMe ? NAVY : SEATC; c.fill();
    if (isHer) txt(c, id, sx + sWidth / 2, sy + sh / 2 + 4, 10.5, 800, NAVY, "center");
    if (isMe) txt(c, meInitial, sx + sWidth / 2, sy + sh / 2 + 4, 11, 800, "#fff", "center");
    if (!isHer && !isMe) { c.fillStyle = "rgba(5,22,77,.06)"; rrect(c, sx + 5, sy + sh - 6, sWidth - 10, 2.5, 1.2); c.fill(); }
  };
  const door = (dx, dy, dw, dh, lbl) => {
    c.save(); rrect(c, dx, dy, dw, dh, 7); c.clip();
    c.fillStyle = "#F1F3F8"; c.fillRect(dx, dy, dw, dh);
    c.fillStyle = "#DCE1EB"; for (let i = 0; i < dw; i += 6) c.fillRect(dx + i, dy, 2.5, dh);
    c.restore();
    txt(c, lbl, dx + dw / 2, dy + dh / 2 + 3, 7, 800, GREY, "center", 1.2);
  };
  const rowNum = (r, ry) => txt(c, String(r), ix + colX[1] + sw + (CAB.aisle) / 2 + g / 2, ry + sh / 2 + 3, 8, 600, "#A3ABBD", "center");

  let cy = y;
  if (half === "front") {
    cy += 30;
    // autista
    rrect(c, ix, cy, colX[1] + sw, 26, 8); c.fillStyle = "#F1F3F8"; c.fill();
    c.strokeStyle = GREY; c.lineWidth = 2; c.beginPath(); c.arc(ix + 16, cy + 13, 6, 0, 7); c.stroke();
    txt(c, "AUTISTA", ix + 28, cy + 16, 7, 800, GREY, "left", 1.2);
    door(ix + colX[2], cy, sw * 2 + g, 26, "PORTA");
    cy += 26 + 10;
    for (let r = 1; r <= 6; r++) {
      seat(r + "A", ix + colX[0], cy, sw); seat(r + "B", ix + colX[1], cy, sw);
      rowNum(r, cy);
      seat(r + "C", ix + colX[2], cy, sw); seat(r + "D", ix + colX[3], cy, sw);
      cy += sh + g;
    }
  } else {
    cy += 16;
    for (let r = 7; r <= 12; r++) {
      seat(r + "A", ix + colX[0], cy, sw); seat(r + "B", ix + colX[1], cy, sw);
      rowNum(r, cy);
      if (r === 7) door(ix + colX[2], cy, sw * 2 + g, sh, "PORTA");
      else { seat(r + "C", ix + colX[2], cy, sw); seat(r + "D", ix + colX[3], cy, sw); }
      cy += sh + g;
    }
    const bw = (inner - 4 * g) / 5;
    ["A", "B", "E", "C", "D"].forEach((l, i) => seat("13" + l, ix + i * (bw + g), cy, bw));
  }
  return h;
}

// ---------- biglietto completo ----------
function drawTicket(o, opt = {}) {
  const withBg = opt.bg !== false;
  // o: { mine, me, friend, from, fromCity, to, toCity }
  const her = neighbour(o.mine), row = +o.mine.slice(0, -1);
  const half = row <= 6 ? "front" : "rear";
  const S = 3, M = 18, TW = 360, X = M;
  const cabH = cabinHeight(half);
  const H_HEAD = 68, H_ROUTE = 92, H_FIELDS = 116, H_SEAT = 100, H_MAPHEAD = 34, H_STUB = 118;
  const H_MAP = H_MAPHEAD + cabH + 22;
  const TH = H_HEAD + H_ROUTE + H_FIELDS + H_SEAT + 22 + H_MAP + 22 + H_STUB;
  const W = TW + 2 * M, H = TH + 2 * M;
  const cv = document.createElement("canvas"); cv.width = W * S; cv.height = H * S;
  const c = cv.getContext("2d"); c.scale(S, S);

  // sfondo
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#E9EDF4"); bg.addColorStop(1, "#D6DDE8");
  if (withBg) { c.fillStyle = bg; c.fillRect(0, 0, W, H); }

  // corpo biglietto
  c.save(); c.shadowColor = "rgba(5,22,77,.18)"; c.shadowBlur = 24; c.shadowOffsetY = 8;
  rrect(c, X, M, TW, TH, 22); c.fillStyle = "#fff"; c.fill(); c.restore();

  // header blu
  c.save(); rrect(c, X, M, TW, TH, 22); c.clip();
  const hg = c.createLinearGradient(X, M, X + TW, M + H_HEAD); hg.addColorStop(0, NAVY); hg.addColorStop(1, NAVY2);
  c.fillStyle = hg; c.fillRect(X, M, TW, H_HEAD);
  c.fillStyle = YEL; c.fillRect(X, M + TH - 7, TW, 7); // filo giallo in fondo
  c.restore();
  let y = M;
  // logo
  c.fillStyle = YEL; c.beginPath(); c.arc(X + 36, y + 34, 17, 0, 7); c.fill();
  busGlyph(c, X + 36, y + 34, 1.25, NAVY);
  txt(c, "SERIANA", X + 62, y + 31, 15, 800, "#fff", "left", 2.2);
  txt(c, "AIRBUS LINES", X + 62, y + 46, 8, 600, "rgba(255,255,255,.65)", "left", 2);
  txt(c, "BOARDING PASS", X + TW - 20, y + 31, 8.5, 800, YEL, "right", 2);
  txt(c, "Carta d'imbarco", X + TW - 20, y + 46, 11, 500, "rgba(255,255,255,.85)", "right");
  y += H_HEAD;

  // rotta
  const now = new Date();
  const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
  const flight = "SA " + (1000 + (doy * 73) % 8999);
  txt(c, o.from, X + 20, y + 52, 40, 800, INK, "left", 1);
  txt(c, o.to, X + TW - 20, y + 52, 40, 800, INK, "right", 1);
  txt(c, o.fromCity, X + 21, y + 70, 11, 500, GREY);
  txt(c, o.toCity, X + TW - 21, y + 70, 11, 500, GREY, "right");
  const lx1 = X + 122, lx2 = X + TW - 122, ly = y + 38;
  c.strokeStyle = LINE; c.lineWidth = 1.5; c.setLineDash([3, 4]);
  c.beginPath(); c.moveTo(lx1, ly); c.lineTo(lx2, ly); c.stroke(); c.setLineDash([]);
  c.fillStyle = NAVY; c.beginPath(); c.arc(lx1, ly, 2.5, 0, 7); c.arc(lx2, ly, 2.5, 0, 7); c.fill();
  c.fillStyle = "#fff"; c.beginPath(); c.arc((lx1 + lx2) / 2, ly, 15, 0, 7); c.fill();
  c.fillStyle = YEL; c.beginPath(); c.arc((lx1 + lx2) / 2, ly, 12, 0, 7); c.fill();
  busGlyph(c, (lx1 + lx2) / 2, ly, 0.95, NAVY);
  txt(c, flight, (lx1 + lx2) / 2, ly - 20, 8.5, 800, GREY, "center", 1.2);
  y += H_ROUTE;

  // separatore sottile
  c.fillStyle = LINE; c.fillRect(X + 20, y, TW - 40, 1);

  // campi
  const months = ["GEN", "FEB", "MAR", "APR", "MAG", "GIU", "LUG", "AGO", "SET", "OTT", "NOV", "DIC"];
  const date = String(now.getDate()).padStart(2, "0") + " " + months[now.getMonth()];
  const time = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const col = [X + 20, X + 146, X + 262];
  const field = (l, v, cx, fy, size = 16) => { label(c, l, cx, fy); txt(c, v, cx, fy + 21, size, 750, INK); };
  field("Passeggero", o.friend.toUpperCase(), col[0], y + 26, 17);
  field("Data", date, col[2], y + 26);
  field("Corsa", flight, col[0], y + 74);
  field("Imbarco", time, col[1], y + 74);
  field("Porta", half === "front" ? "Davanti" : "Centrale", col[2], y + 74);
  y += H_FIELDS;

  // pannello posto
  rrect(c, X + 20, y, 136, 82, 16); c.fillStyle = YEL; c.fill();
  txt(c, "POSTO", X + 36, y + 22, 8.5, 800, NAVY, "left", 1.6);
  txt(c, her, X + 34, y + 68, 46, 850, NAVY, "left", -1);
  const sideTxt = { A: "Finestrino", B: "Corridoio", C: "Corridoio", D: "Finestrino", E: "Centrale" }[her.slice(-1)];
  const sideLR = { A: "sinistra", B: "sinistra", C: "destra", D: "destra", E: "ultima fila" }[her.slice(-1)];
  label(c, "Fila", col[1] + 26, y + 14); txt(c, String(row), col[1] + 26, y + 36, 18, 750, INK);
  label(c, "Lato", col[1] + 82, y + 14); txt(c, sideTxt, col[1] + 82, y + 34, 13.5, 750, INK);
  txt(c, sideLR, col[1] + 82, y + 47, 10, 500, GREY);
  label(c, "Accanto a", col[1] + 26, y + 66);
  rrect(c, col[1] + 26, y + 72, 9, 9, 2.5); c.fillStyle = NAVY; c.fill();
  txt(c, `${o.me.toUpperCase()} · ${o.mine}`, col[1] + 40, y + 81, 12.5, 750, INK);
  y += H_SEAT;

  // perforazione
  const perforate = py => {
    c.save(); c.globalCompositeOperation = "destination-out";
    c.beginPath(); c.arc(X, py, 11, 0, 7); c.arc(X + TW, py, 11, 0, 7); c.fill(); c.restore();
    c.strokeStyle = LINE; c.lineWidth = 1.4; c.setLineDash([5, 5]);
    c.beginPath(); c.moveTo(X + 18, py); c.lineTo(X + TW - 18, py); c.stroke(); c.setLineDash([]);
  };
  // le tacche bucano anche lo sfondo: ridisegno lo sfondo dietro dopo
  const perfs = [y + 11];
  y += 22;

  // mappa
  label(c, "La tua posizione", X + 20, y + 18);
  const tag = half === "front" ? "PARTE ANTERIORE" : "PARTE POSTERIORE";
  c.font = `800 7.5px ${FONT}`;
  const tw = c.measureText(tag).width + tag.length * 1.2 + 14;
  rrect(c, X + TW - 20 - tw, y + 7, tw, 16, 8); c.fillStyle = "#EEF1F7"; c.fill();
  txt(c, tag, X + TW - 20 - tw / 2, y + 18, 7.5, 800, NAVY, "center", 1.2);
  y += H_MAPHEAD;
  const cabX = X + 22;
  if (half === "rear") txt(c, "▲ verso l'autista", cabX + CAB.w / 2, y + 1, 8, 600, "#A3ABBD", "center");
  drawCabin(c, cabX, y + 6, half, her, o.mine, (o.me[0] || "S").toUpperCase());
  // legenda
  const lgX = cabX + CAB.w + 22;
  let lgY = y + 26;
  const legend = (color, title, sub) => {
    rrect(c, lgX, lgY - 11, 14, 14, 4); c.fillStyle = color; c.fill();
    txt(c, title, lgX + 22, lgY, 12.5, 750, INK);
    txt(c, sub, lgX + 22, lgY + 15, 10, 500, GREY);
    lgY += 44;
  };
  legend(YEL, "Tu", `${o.friend} · ${her}`);
  legend(NAVY, o.me, `posto ${o.mine}`);
  c.fillStyle = LINE; c.fillRect(lgX, lgY - 14, TW - (lgX - X) - 20, 1);
  lgY += 6;
  label(c, "Sali da", lgX, lgY);
  txt(c, half === "front" ? "Porta davanti" : "Porta centrale", lgX, lgY + 18, 12.5, 750, INK);
  txt(c, half === "front" ? "subito dopo l'autista" : "a metà pullman", lgX, lgY + 32, 10, 500, GREY);
  y += H_MAP - H_MAPHEAD;

  perfs.push(y + 11);
  y += 22;

  // talloncino
  fakeCode(c, X + 22, y + 14, 84, o.mine + o.friend + date);
  txt(c, `Buon viaggio, ${o.friend}`, X + 124, y + 34, 15, 800, INK);
  txt(c, `${o.me} ti aspetta al ${o.mine}`, X + 124, y + 52, 11, 500, GREY);
  label(c, "Gruppo", X + 124, y + 76); txt(c, "A", X + 124, y + 93, 14, 800, INK);
  label(c, "Seq", X + 180, y + 76); txt(c, String(100 + (doy * 7 + row * 13) % 899).padStart(3, "0"), X + 180, y + 93, 14, 800, INK);
  label(c, "Classe", X + 232, y + 76); txt(c, "Pullman", X + 232, y + 93, 14, 800, INK);

  // tacche e linee
  perfs.forEach(perforate);
  // ridipingo lo sfondo sotto le tacche
  if (withBg) { c.save(); c.globalCompositeOperation = "destination-over";
  c.fillStyle = bg; c.fillRect(0, 0, W, H); c.restore(); }

  return { canvas: cv, her, half };
}

</script>
<script>
// ================= MAPPA =================
const bus = $("bus"), seats = {};
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const hz = () => { const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); i.className = "hz";
  i.setAttribute("aria-hidden", "true"); i.tabIndex = -1; i.addEventListener("change", () => { i.checked = false; }); return i; };
const seatBtn = id => { const b = mk("div", "seat", id); b.setAttribute("role", "button"); b.append(hz()); b.dataset.id = id; b.setAttribute("aria-label", "Posto " + id); seats[id] = b; return b; };
for (let r = 1; r < LAST; r++){
  const row = mk("div", "row");
  row.append(seatBtn(r+"A"), seatBtn(r+"B"), mk("div", "num", r));
  if (r === DOOR_ROW) row.append(mk("div", "cell door", "PORTA"));
  else row.append(seatBtn(r+"C"), seatBtn(r+"D"));
  bus.append(row);
}
const back = mk("div", "row back"); "ABECD".split("").forEach(l => back.append(seatBtn(LAST + l))); bus.append(back);
bus.addEventListener("click", e => { const b = e.target.closest(".seat"); if (b) select(b.dataset.id); });

function select(id){
  if (mine && seats[mine]) seats[mine].classList.remove("sel");
  haptic(8);
  mine = id; store.set("mySeat", id);
  seats[id].classList.add("sel");
  $("dSeat").textContent = id; $("dSide").textContent = SIDE[id.slice(-1)];
  $("dock").classList.add("on");
  shareFile = null;
}

function paintHeader(){
  $("rFrom").textContent = cfg.from; $("rTo").textContent = cfg.to;
  $("rFromCity").textContent = cfg.fromCity; $("rToCity").textContent = cfg.toCity;
  const m = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"], d = new Date();
  $("rDate").textContent = d.getDate() + " " + m[d.getMonth()];
  $("rTime").textContent = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  $("signDest").textContent = cfg.toCity.toUpperCase().slice(0,12);
  document.querySelectorAll(".fname").forEach(e => e.textContent = cfg.friend);
}

// ================= VIBRAZIONE =================
// iOS non ha navigator.vibrate: un interruttore nativo (input switch) creato e cliccato al volo
// fa scattare la Taptic Engine (Safari iOS 18+)
function haptic(ms = 12){
  if (typeof navigator.vibrate === "function") { try { if (navigator.vibrate(ms)) return; } catch(e){} }
  try {
    const l = document.createElement("label"); l.setAttribute("aria-hidden", "true"); l.style.display = "none";
    const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", "");
    l.appendChild(i); document.head.appendChild(l); l.click(); document.head.removeChild(l);
  } catch(e){}
}
let hTimers = [];
function printHaptics(){
  hTimers.forEach(clearTimeout); hTimers = [];
  // tratti in cui il biglietto avanza (in ms, come l'animazione da 1.9 s)
  const moves = [[0, 228], [304, 684], [760, 1178], [1254, 1900]];
  for (const [a, b] of moves) for (let t = a; t < b; t += 65) hTimers.push(setTimeout(() => haptic(10), t));
  hTimers.push(setTimeout(() => haptic(35), 1950));        // colpo finale: biglietto pronto
}

// ================= STAMPA =================
const stage = $("stage");
function printTicket(){
  if (!mine) return;
  const { canvas } = drawTicket({ mine, ...cfg });              // immagine da inviare (con sfondo)
  ticketURL = canvas.toDataURL("image/png");
  canvas.toBlob(b => { try{ shareFile = new File([b], `carta-imbarco-${neighbour(mine)}.png`, {type:"image/png"}); }catch(e){ shareFile = b; } }, "image/png");
  const img = $("ticket");
  stage.className = "stage on";
  let started = false;
  const start = () => { if (started) return; started = true;
    // dimensiono il biglietto per stare nello spazio e la stampante sulla larghezza della carta
    const slot = img.parentElement, cw = slot.clientWidth, ch = slot.clientHeight;
    const r = img.naturalWidth / img.naturalHeight;
    let h = ch, w = h * r; if (w > cw) { w = cw; h = w / r; }
    img.style.width = w + "px"; img.style.height = h + "px";
    const paperW = w * (360 / 396);                              // la carta senza i margini trasparenti
    $("printer").style.width = Math.min(cw, paperW + 28) + "px";
    void img.offsetWidth;
    stage.classList.add("printing");
    printHaptics();
    clearTimeout(stage._t);
    stage._t = setTimeout(finish, 1950);
  };
  // se il biglietto è identico al precedente "load" non riparte: azzero la src e uso anche decode()
  img.removeAttribute("src");
  img.onload = start;
  img.src = drawTicket({ mine, ...cfg }, { bg:false }).canvas.toDataURL("image/png"); // a schermo
  if (img.decode) img.decode().then(start).catch(() => setTimeout(start, 50));
  setTimeout(start, 400); // rete di sicurezza
}
function finish(){ stage.classList.remove("printing"); stage.classList.add("done"); }
$("ticket").addEventListener("click", () => { if (stage.classList.contains("printing")) { clearTimeout(stage._t); hTimers.forEach(clearTimeout); haptic(35); finish(); } });
$("printBtn").append(hz());
$("printBtn").onclick = () => setTimeout(printTicket, 90);
// anche "Invia" e il tocco per saltare la stampa danno il tic
$("send").style.position = "relative"; $("send").append(hz());
$("closeStage").onclick = () => { hTimers.forEach(clearTimeout); stage.className = "stage"; };

// ================= INVIO =================
$("send").onclick = () => setTimeout(sendTicket, 60);
async function sendTicket(){
  const file = shareFile instanceof File ? shareFile : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); return; }
    catch(e){ if (e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": fetch(ticketURL).then(r => r.blob()) })]);
    toast("Biglietto copiato: incollalo in WhatsApp");
  } catch(e){ toast("Tieni premuto sul biglietto per salvarlo"); }
}

// ================= IMPOSTAZIONI =================
const fields = { sMe:"me", sFriend:"friend", sFrom:"from", sFromCity:"fromCity", sTo:"to", sToCity:"toCity" };
$("gear").onclick = () => { for (const k in fields) $(k).value = cfg[fields[k]]; $("sheet").classList.add("on"); };
$("saveSet").onclick = () => {
  for (const k in fields){
    let v = $(k).value.trim(); if (!v) continue;
    if (k === "sFrom" || k === "sTo") v = v.toUpperCase().slice(0,3);
    cfg[fields[k]] = v; store.set(fields[k] === "friend" ? "friendName" : fields[k], v);
  }
  $("sheet").classList.remove("on"); paintHeader(); shareFile = null;
};
$("sheet").onclick = e => { if (e.target.id === "sheet") $("sheet").classList.remove("on"); };

function toast(t){ const x = $("toast"); x.textContent = t; x.classList.add("on"); clearTimeout(x._t); x._t = setTimeout(() => x.classList.remove("on"), 1800); }

// ================= NIENTE ZOOM =================
// iOS Safari ignora user-scalable=no: blocco pinch e doppio tocco a mano
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive:false });
let lastTouch = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouch < 350 && !e.target.closest("input")) e.preventDefault();
  lastTouch = now;
}, { passive:false });

paintHeader();
if (mine && seats[mine]) select(mine); else mine = null;
</script>
</body>
</html>
